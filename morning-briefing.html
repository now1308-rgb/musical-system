<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국 주식 모닝 브리핑</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:      #0d1117;
      --bg2:     #161b22;
      --card:    #1c2433;
      --border:  #30363d;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --dim:     #484f58;
      --up:      #f85149;
      --down:    #388bfd;
      --green:   #3fb950;
      --yellow:  #d29922;
      --purple:  #bc8cff;
      --accent:  #58a6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      max-width: 1120px;
      margin: 0 auto;
      font-size: 14px;
    }

    /* ── Header ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 28px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 22px; font-weight: 700; color: var(--accent); letter-spacing: -.5px; }
    header .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .hdr-r { text-align: right; }
    #clock { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
    #refDate { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .refresh-btn {
      margin-top: 8px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: all .15s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Section ── */
    .section { margin-bottom: 28px; }
    .sec-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sec-title::before {
      content: '';
      width: 3px; height: 13px;
      background: var(--accent);
      border-radius: 2px;
      display: inline-block;
    }

    /* ── Overview ── */
    .ov-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .ov-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
    }
    .ov-label { font-size: 11px; color: var(--muted); margin-bottom: 12px; font-weight: 500; }

    /* FX */
    .fx-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; }
    .fx-pair { font-size: 12px; color: var(--muted); }
    .fx-val  { font-size: 15px; font-weight: 700; }
    .fx-chg  { font-size: 11px; margin-left: 6px; }

    /* Sentiment */
    .sent-score { font-size: 34px; font-weight: 800; line-height: 1; }
    .sent-lbl   { font-size: 13px; font-weight: 600; margin-top: 4px; }
    .sent-bar-wrap {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
    }
    .sent-bar-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(to right, #388bfd 0%, #3fb950 50%, #f85149 100%);
    }
    .flow-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* Market summary */
    .sum-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      font-size: 12px;
      color: var(--muted);
    }

    /* ── Stock Cards ── */
    .stocks-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .stock-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: all .15s;
      position: relative;
      min-height: 110px;
    }
    .stock-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,.35); }
    .stock-card.selected { border-color: var(--accent); background: #172030; }
    .sc-name { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
    .sc-code { font-size: 11px; color: var(--dim); margin-bottom: 8px; }
    .sc-price { font-size: 18px; font-weight: 700; margin-bottom: 3px; }
    .sc-chg  { font-size: 12px; margin-bottom: 6px; }
    .sc-vol  { font-size: 11px; color: var(--dim); }
    .sc-spark { position: absolute; bottom: 10px; right: 10px; }

    .up   { color: var(--up); }
    .dn   { color: var(--down); }
    .neu  { color: var(--muted); }

    /* ── Chart ── */
    .chart-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      display: none;
    }
    .chart-box.visible { display: block; }
    .chart-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .chart-title { font-size: 15px; font-weight: 700; }
    .chart-stats { display: flex; gap: 24px; }
    .cstat { text-align: right; }
    .cstat-lbl { font-size: 11px; color: var(--muted); }
    .cstat-val { font-size: 13px; font-weight: 600; }
    .chart-wrap { position: relative; height: 240px; }

    /* ── DART ── */
    .dart-list {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .dart-item {
      display: grid;
      grid-template-columns: 110px 1fr auto 70px;
      gap: 14px;
      align-items: center;
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
      transition: background .15s;
      cursor: pointer;
    }
    .dart-item:last-child { border-bottom: none; }
    .dart-item:hover { background: rgba(255,255,255,.025); }
    .dart-co   { font-size: 13px; font-weight: 600; color: var(--accent); }
    .dart-txt  { font-size: 13px; line-height: 1.45; }
    .dart-time { font-size: 12px; color: var(--dim); text-align: right; }
    .badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .b-key { background: rgba(188,140,255,.15); color: var(--purple); }
    .b-reg { background: rgba(63,185,80,.15);   color: var(--green);  }
    .b-fin { background: rgba(210,153,34,.15);  color: var(--yellow); }
    .b-etc { background: rgba(88,166,255,.15);  color: var(--accent); }

    /* ── News ── */
    .news-list {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .news-item {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background .15s;
    }
    .news-item:last-child { border-bottom: none; }
    .news-item:hover { background: rgba(255,255,255,.025); }
    .news-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .news-src  { font-size: 11px; color: var(--accent); font-weight: 600; }
    .news-time { font-size: 11px; color: var(--dim); }
    .news-ttl  { font-size: 13px; line-height: 1.5; }
    .news-prev { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }

    /* ── Footer ── */
    footer {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--dim);
      font-size: 11px;
      text-align: center;
      line-height: 1.6;
    }

    @media (max-width: 800px) {
      .ov-grid     { grid-template-columns: 1fr; }
      .stocks-grid { grid-template-columns: repeat(2, 1fr); }
      .dart-item   { grid-template-columns: 1fr auto; grid-template-rows: auto auto; }
      .dart-co     { grid-column: 1; }
      .dart-time   { grid-column: 2; }
      .dart-txt    { grid-column: 1 / -1; }
      .badge       { grid-column: 1; }
      .chart-stats { flex-direction: column; gap: 6px; }
    }
  </style>
</head>

// =========================================================
// 유틸
// =========================================================

const fmt = (n, d = 0) => n.toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = n => `${n >= 0 ? '+' : ''}${n.toFixed(2)}%`;
const arrow = (n, d = 0) => `${n >= 0 ? '▲' : '▼'}${fmt(Math.abs(n), d)}`;
const cls = n => n > 0 ? 'up' : n < 0 ? 'dn' : 'neu';

function getTradingDates(days = 30) {
  const out = [];
  const d = new Date();
  for (let i = days - 1; i >= 0; i--) {
    const t = new Date(d);
    t.setDate(d.getDate() - i);
    if (t.getDay() !== 0 && t.getDay() !== 6)
      out.push(`${t.getMonth()+1}/${t.getDate()}`);
  }
  return out;
}

function genHistory(price, vola) {
  const dates = getTradingDates(42); // 42일치 달력 → 약 30거래일
  const prices = new Array(dates.length);
  prices[prices.length - 1] = price;
  for (let i = prices.length - 2; i >= 0; i--) {
    const d = (Math.random() - 0.47) * vola;
    prices[i] = prices[i + 1] * (1 - d / 100);
  }
  return { dates, prices: prices.map(p => parseFloat(p.toFixed(2))) };
}

function sparkSvg(prices, color) {
  const W = 68, H = 26;
  const mn = Math.min(...prices), mx = Math.max(...prices), rng = mx - mn || 1;
  const pts = prices.map((p, i) => {
    const x = (i / (prices.length - 1)) * W;
    const y = H - ((p - mn) / rng) * (H - 4) - 2;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

// =========================================================
// MCP 유틸 — callMcpTool 반환 포맷 파싱
// =========================================================

// callMcpTool 실제 반환 포맷: { content: [{ type: 'text', text: '...' }] }
function parseResp(raw) {
  if (!raw) return null;
  if (raw.content && Array.isArray(raw.content) && raw.content[0]?.type === 'text') {
    try { return JSON.parse(raw.content[0].text); } catch { return raw.content[0].text; }
  }
  return raw;
}

// MCP 도구 호출 래퍼 — 환경에 callMcpTool 없으면 null 반환 (fallback 처리 책임은 호출부)
async function callMcp(toolName, params = {}) {
  try {
    if (typeof window.callMcpTool === 'function') {
      const raw = await window.callMcpTool(toolName, params);
      return parseResp(raw);
    }
  } catch (e) {
    console.warn(`MCP "${toolName}" 호출 실패:`, e);
  }
  return null;
}

// =========================================================
// 렌더링
// =========================================================

function renderClock() {
  const n = new Date();
  const pad = v => String(v).padStart(2, '0');
  document.getElementById('clock').textContent =
    `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('refDate').textContent =
    `기준일: ${n.getFullYear()}.${pad(n.getMonth()+1)}.${pad(n.getDate())}(${days[n.getDay()]})`;
}

function renderFx() {
  document.getElementById('fxEl').innerHTML = FX.map(f => `
    <div class="fx-row">
      <span class="fx-pair">${f.pair}</span>
      <span>
        <span class="fx-val ${cls(f.chg)}">${fmt(f.val, 2)}</span>
        <span class="fx-chg ${cls(f.chg)}">${arrow(f.chg, 2)} (${pct(f.pct)})</span>
      </span>
    </div>`).join('');
}

function renderSentiment() {
  const score = 62;
  const lbl = score >= 70 ? '극단적 탐욕' : score >= 55 ? '탐욕' : score >= 45 ? '중립' : score >= 30 ? '공포' : '극단적 공포';
  const color = score >= 55 ? 'var(--up)' : score >= 45 ? 'var(--yellow)' : 'var(--down)';
  document.getElementById('sentEl').innerHTML = `
    <div class="sent-score" style="color:${color}">${score}</div>
    <div class="sent-lbl" style="color:${color}">공포&탐욕: ${lbl}</div>
    <div class="sent-bar-wrap">
      <div class="sent-bar-fill" style="width:${score}%"></div>
    </div>
    <div class="flow-row" style="margin-top:8px">
      <span>외국인 <span class="up">+2,847억</span></span>
      <span>기관 <span class="dn">-1,234억</span></span>
    </div>
    <div class="flow-row" style="margin-top:2px">
      <span>개인 <span class="dn">-1,613억</span></span>
      <span>프로그램 <span class="up">+456억</span></span>
    </div>`;
}

function renderSummary() {
  document.getElementById('sumEl').innerHTML = `
    <div class="sum-row"><span>장 구분</span><span class="up">정규장 진행중</span></div>
    <div class="sum-row"><span>거래대금</span><span style="color:var(--text)">12.0조원</span></div>
    <div class="sum-row"><span>상한가</span><span class="up">12종목</span></div>
    <div class="sum-row"><span>하한가</span><span class="dn">1종목</span></div>
    <div class="sum-row"><span>상승:하락</span><span style="color:var(--text)">521 : 312</span></div>
    <div class="sum-row"><span>보합</span><span style="color:var(--text)">89종목</span></div>`;
}

window._hist = {};

function renderStocks() {
  STOCKS.forEach(s => { window._hist[s.key] = genHistory(s.price, s.vola); });

  document.getElementById('stocksGrid').innerHTML = STOCKS.map(s => {
    const h = window._hist[s.key];
    const sparkPrices = h.prices.slice(-10);
    const color = s.pct >= 0 ? '#f85149' : '#388bfd';
    const priceStr = s.isIdx ? fmt(s.price, 2) : fmt(s.price) + '원';
    return `
      <div class="stock-card" data-key="${s.key}" onclick="selectStock('${s.key}')">
        <div class="sc-name">${s.name}</div>
        <div class="sc-code">${s.code}</div>
        <div class="sc-price ${cls(s.pct)}">${priceStr}</div>
        <div class="sc-chg ${cls(s.pct)}">${arrow(s.chg, s.isIdx ? 2 : 0)} (${pct(s.pct)})</div>
        <div class="sc-vol">거래대금 ${s.vol}</div>
        <div class="sc-spark">${sparkSvg(sparkPrices, color)}</div>
      </div>`;
  }).join('');
}

let chartInst = null;

function selectStock(key) {
  document.querySelectorAll('.stock-card').forEach(c =>
    c.classList.toggle('selected', c.dataset.key === key));

  const s = STOCKS.find(x => x.key === key);
  const h = window._hist[key];
  const box = document.getElementById('chartBox');
  box.classList.add('visible');

  document.getElementById('chartTitle').textContent =
    `${s.name} (${s.code}) — 최근 30거래일 주가`;

  const prices = h.prices;
  const mn = Math.min(...prices), mx = Math.max(...prices);
  const chg30 = ((prices[prices.length-1] - prices[0]) / prices[0] * 100);
  const dec = s.isIdx ? 2 : 0;

  document.getElementById('chartStats').innerHTML = `
    <div class="cstat">
      <div class="cstat-lbl">30일 등락률</div>
      <div class="cstat-val ${cls(chg30)}">${chg30 >= 0 ? '+' : ''}${chg30.toFixed(2)}%</div>
    </div>
    <div class="cstat">
      <div class="cstat-lbl">30일 최고</div>
      <div class="cstat-val">${fmt(mx, dec)}</div>
    </div>
    <div class="cstat">
      <div class="cstat-lbl">30일 최저</div>
      <div class="cstat-val">${fmt(mn, dec)}</div>
    </div>`;

  if (chartInst) { chartInst.destroy(); chartInst = null; }

  const isUp = s.pct >= 0;
  const lineColor = isUp ? '#f85149' : '#388bfd';
  const ctx = document.getElementById('mainChart').getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 240);
  grad.addColorStop(0, isUp ? 'rgba(248,81,73,.25)' : 'rgba(56,139,253,.25)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');

  chartInst = new Chart(ctx, {
    type: 'line',
    data: {
      labels: h.dates,
      datasets: [{
        data: prices,
        borderColor: lineColor,
        backgroundColor: grad,
        borderWidth: 2,
        fill: true,
        pointRadius: 0,
        pointHoverRadius: 5,
        pointHoverBackgroundColor: lineColor,
        pointHoverBorderColor: '#fff',
        pointHoverBorderWidth: 2,
        tension: 0.35,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1c2433',
          titleColor: '#8b949e',
          bodyColor: '#e6edf3',
          borderColor: '#30363d',
          borderWidth: 1,
          padding: 10,
          callbacks: {
            label: ctx => ` ${fmt(ctx.parsed.y, dec)}${s.isIdx ? '' : '원'}`
          }
        }
      },
      scales: {
        x: {
          grid: { color: '#21262d' },
          ticks: { color: '#8b949e', font: { size: 11 }, maxTicksLimit: 8 },
          border: { color: '#30363d' }
        },
        y: {
          position: 'right',
          grid: { color: '#21262d' },
          ticks: {
            color: '#8b949e',
            font: { size: 11 },
            callback: v => fmt(v, s.isIdx ? 1 : 0)
          },
          border: { color: '#30363d' }
        }
      }
    }
  });

  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function dartItemHtml(d) {
  return `<div class="dart-item">
    <div class="dart-co">${d.co}</div>
    <div class="dart-txt">${d.title}</div>
    <span class="badge ${d.badge}">${d.btxt}</span>
    <div class="dart-time">${d.time}</div>
  </div>`;
}

async function renderDart() {
  const el = document.getElementById('dartEl');
  el.innerHTML = '<div style="padding:18px 20px;color:var(--muted);font-size:13px">공시 불러오는 중…</div>';

  // DART MCP 도구가 연결된 환경이면 실시간 데이터 우선 시도
  const live = await callMcp('dart_recent_disclosures', { count: 7 });
  if (Array.isArray(live) && live.length) {
    el.innerHTML = live.map(dartItemHtml).join('');
    return;
  }

  // fallback: 모의 데이터
  el.innerHTML = DART.map(dartItemHtml).join('');
}

function renderNews() {
  document.getElementById('newsEl').innerHTML = NEWS.map(n => `
    <div class="news-item">
      <div class="news-meta">
        <span class="news-src">${n.src}</span>
        <span class="news-time">${n.time}</span>
      </div>
      <div class="news-ttl">${n.ttl}</div>
      <div class="news-prev">${n.prev}</div>
    </div>`).join('');
}

function refresh() {
  renderStocks();
  const sel = document.querySelector('.stock-card.selected');
  if (sel) selectStock(sel.dataset.key);
}

// =========================================================
// 초기화
// =========================================================

async function init() {
  renderClock();
  setInterval(renderClock, 1000);
  renderFx();
  renderSentiment();
  renderSummary();
  renderStocks();
  await renderDart();   // MCP 응답 대기
  renderNews();
  setTimeout(() => selectStock('kospi'), 150);
}

document.addEventListener('DOMContentLoaded', init);
</script>
